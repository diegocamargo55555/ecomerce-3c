services:
  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: ecomerce
      MYSQL_USER: ecomerce
      MYSQL_PASSWORD: lolseek001
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--protocol=tcp" ]
      interval: 5s
      retries: 10

  php:
    build:
      context: ./Backend
      dockerfile: Dockerfile.dev
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ecomerce
      DB_USERNAME: ecomerce
      DB_PASSWORD: lolseek001
    ports:
      - "8000:8000"
    volumes:
      - ./Backend:/app
      - /app/vendor
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - "exit(@file_get_contents('http://127.0.0.1:8000/up') === false ? 1 : 0);"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  proxy:
    container_name: proxy
    image: nginx:stable-alpine
    depends_on:
      php:
        condition: service_healthy
      frontend:
        condition: service_started
    volumes:
      - ./proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped

volumes:
  mysql_data:
